name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install vim
        run: sudo apt-get update && sudo apt-get install -y vim

      - name: Install vader.vim
        run: |
          mkdir -p ~/.vim/pack/testing/start
          git clone https://github.com/junegunn/vader.vim.git ~/.vim/pack/testing/start/vader.vim

      - name: Run Vim tests
        run: ./run_tests.sh

      - name: Run Python tests
        # The spec tests need the bridle binary, which CI doesn't have yet;
        # they run in the local check.
        run: uv run pytest test/unit/ --ignore=test/unit/test_specs_bdd.py
